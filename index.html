<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#10131e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111827'/%3E%3Cpath d='M6 22 16 7l10 15h-7l-3-5-3 5z' fill='%23ffcc70'/%3E%3C/svg%3E">
<title>Midnight Dojo — Street Brawl</title>
<style>
:root{color-scheme:dark;--ink:#f7f0dc;--muted:#a9adc0;--gold:#ffcc70;--red:#f15b60}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10131e;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
body{display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#27253a 0,#151827 60%,#0d1018 100%)}
.game-shell{position:relative;width:min(100vw, calc(100vh * 1.7778));aspect-ratio:16/9;overflow:hidden;background:#1a2030;box-shadow:0 24px 90px #0009;border:1px solid #ffffff20}
canvas{display:block;width:100%;height:100%;}
.brand{position:absolute;top:3.2%;left:3.2%;font-weight:900;letter-spacing:.18em;font-size:clamp(10px,1.2vw,15px);color:#fff9;text-shadow:0 2px 8px #000}
.controls-hint{position:absolute;right:3.2%;top:3.4%;color:#fff9;font-size:clamp(9px,1vw,12px);letter-spacing:.08em;text-align:right;text-shadow:0 2px 6px #000}
.touch-controls{position:absolute;inset:auto 0 3.5%;display:none;align-items:end;justify-content:space-between;padding:0 4%;pointer-events:none}
.pad,.actions{display:flex;gap:clamp(7px,1vw,12px);align-items:end;pointer-events:auto}.actions{align-items:center}
.touch-btn{width:clamp(44px,8vw,68px);height:clamp(44px,8vw,68px);border:1px solid #ffffff8a;border-radius:50%;background:#172035b8;color:#fff;font-size:clamp(17px,3vw,26px);font-weight:800;box-shadow:0 5px 16px #0006,inset 0 0 0 4px #ffffff12;backdrop-filter:blur(4px);touch-action:none}
.touch-btn.attack{background:#a93440c9;border-color:#ffc1a8}.touch-btn.jump{background:#385d91c9;border-color:#b9d8ff}.touch-btn:active,.touch-btn.down{transform:scale(.94);background-color:#ffffff55}
@media (pointer:coarse),(max-width:700px){.touch-controls{display:flex}.controls-hint{top:3%;right:3%;max-width:45%;font-size:9px}.brand{top:3%;left:3%}}
</style>
</head>
<body>
<main class="game-shell" aria-label="Midnight Dojo fighting game">
<canvas id="game" width="960" height="540" aria-label="Game screen"></canvas>
<div class="brand">MIDNIGHT DOJO <span style="color:#ffcc70">/</span> STREET BRAWL</div>
<div class="controls-hint">MOVE&nbsp; A / D &nbsp;·&nbsp; JUMP&nbsp; W / ↑<br>STRIKE&nbsp; SPACE / J&nbsp; · &nbsp;PAUSE&nbsp; ESC</div>
<div class="touch-controls" aria-label="Touch controls">
<div class="pad"><button class="touch-btn" data-key="left" aria-label="Move left">◀</button><button class="touch-btn" data-key="right" aria-label="Move right">▶</button></div>
<div class="actions"><button class="touch-btn attack" data-key="attack" aria-label="Punch">✊</button><button class="touch-btn jump" data-key="jump" aria-label="Jump">↑</button></div>
</div>
</main>
<script>
'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');
const W=960,H=540,keys={left:false,right:false,jump:false},TAU=Math.PI*2;
let state='title',last=0,time=0,shake=0,flash=0,player,enemies=[],particles=[],floaters=[],wave=0,score=0,kos=0,spawnTimer=0,combo=0,comboTimer=0,best=Number(localStorage.getItem('dojoBest')||0);
function resize(){const dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function rand(a,b){return a+Math.random()*(b-a)}
function startGame(){state='play';score=0;wave=0;kos=0;time=0;shake=0;flash=0;combo=0;comboTimer=0;particles=[];floaters=[];enemies=[];player={x:270,y:390,vx:0,vy:0,face:1,hp:100,maxHp:100,attack:0,cooldown:0,invuln:0,walk:0,hit:0};nextWave()}
function nextWave(){wave++;const count=Math.min(2+wave,7);for(let i=0;i<count;i++){const side=i%2?1:-1;enemies.push({x:side<0?rand(70,170):rand(790,900),y:rand(365,420),vx:0,vy:0,face:side<0?1:-1,hp:wave<3?36:36+wave*3,maxHp:wave<3?36:36+wave*3,speed:rand(35,52)+wave*2,attack:0,cooldown:rand(.4,1.4),stun:0,flash:0,walk:0,kind:Math.random()<.25?'swift':'bruiser',dead:false})}spawnTimer=0}
function burst(x,y,color,n=8){for(let i=0;i<n;i++){const a=rand(0,TAU),s=rand(45,220);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-35,life:rand(.22,.6),max:.6,color,size:rand(2,5)})}}
function floatText(x,y,text,color='#fff0c2'){floaters.push({x,y,text,color,life:.8})}
function doAttack(){if(state==='title'||state==='over'){startGame();return}if(state==='paused'){state='play';return}if(state!=='play'||player.cooldown>0)return;player.attack=.23;player.cooldown=.38;const reach=88;let hit=false;
 for(const e of enemies){if(e.dead)continue;const dx=e.x-player.x,dy=e.y-player.y;if(dx*player.face>5&&dx*player.face<reach&&Math.abs(dy)<58){const damage=e.kind==='swift'?22:25;e.hp-=damage;e.stun=.34;e.flash=.13;e.vx=player.face*(e.kind==='swift'?310:240);e.vy=-65;burst(e.x,e.y-25,'#ffc56b',8);hit=true;if(e.hp<=0){e.dead=true;kos++;score+=100+wave*15;combo++;comboTimer=2.2;score+=Math.max(0,combo-1)*25;floatText(e.x,e.y-68,combo>1?`K.O.  +${100+wave*15+Math.max(0,combo-1)*25}  ×${combo}`:`K.O.  +${100+wave*15}`, '#ffe39b');burst(e.x,e.y-25,'#ff746f',18)}else floatText(e.x,e.y-65,`-${damage}`,'#ffdb9a');shake=Math.max(shake,e.dead?.13:.07)}}
 if(!hit){burst(player.x+player.face*55,player.y-46,'#fff0c2',3)}}
function hurt(amount,from){if(player.invuln>0||state!=='play')return;player.hp=Math.max(0,player.hp-amount);player.invuln=.75;player.hit=.2;player.vx=from<player.x?180:-180;player.vy=-105;shake=.18;flash=.16;burst(player.x,player.y-30,'#ff5c69',9);floatText(player.x,player.y-75,`-${amount}`,'#ff7379');if(player.hp<=0){state='over';best=Math.max(best,score);localStorage.setItem('dojoBest',best)}}
function keyChange(e,on){const k=e.key.toLowerCase();if(['arrowleft','arrowright','arrowup',' ','a','d','w','j','escape','enter'].includes(k))e.preventDefault();if(k==='a'||k==='arrowleft')keys.left=on;if(k==='d'||k==='arrowright')keys.right=on;if(k==='w'||k==='arrowup')keys.jump=on;if(on&&!e.repeat&&(k===' '||k==='j'))doAttack();if(on&&!e.repeat&&k==='enter'&&(state==='title'||state==='over'))startGame();if(on&&!e.repeat&&k==='escape'){if(state==='play')state='paused';else if(state==='paused')state='play'}}
addEventListener('keydown',e=>keyChange(e,true));addEventListener('keyup',e=>keyChange(e,false));
for(const b of document.querySelectorAll('.touch-btn')){const k=b.dataset.key;const down=e=>{e.preventDefault();b.classList.add('down');if(k==='attack')doAttack();else if(k==='jump'){keys.jump=true;if(player&&player.y>=389&&state==='play')player.vy=-435}else keys[k]=true};const up=e=>{e.preventDefault();b.classList.remove('down');if(k!=='attack'&&k!=='jump')keys[k]=false;if(k==='jump')keys.jump=false};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up)}
addEventListener('blur',()=>{keys.left=keys.right=keys.jump=false;if(state==='play')state='paused'});
function update(dt){time+=dt;shake=Math.max(0,shake-dt);flash=Math.max(0,flash-dt);if(comboTimer>0){comboTimer-=dt;if(comboTimer<=0)combo=0}
 for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=380*dt;p.vx*=Math.pow(.12,dt);p.life-=dt}particles=particles.filter(p=>p.life>0);for(const f of floaters){f.y-=34*dt;f.life-=dt}floaters=floaters.filter(f=>f.life>0);
 if(state!=='play')return;
 player.cooldown=Math.max(0,player.cooldown-dt);player.attack=Math.max(0,player.attack-dt);player.invuln=Math.max(0,player.invuln-dt);player.hit=Math.max(0,player.hit-dt);
 const dir=(keys.right?1:0)-(keys.left?1:0);if(dir){player.face=dir;player.vx=dir*245;player.walk+=dt*11}else player.vx*=Math.pow(.0007,dt);player.x=clamp(player.x+player.vx*dt,40,920);
 if(keys.jump&&player.y>=389){player.vy=-435;keys.jump=false}player.vy+=1050*dt;player.y+=player.vy*dt;if(player.y>390){player.y=390;player.vy=0}
 for(const e of enemies){if(e.dead)continue;e.cooldown-=dt;e.attack=Math.max(0,e.attack-dt);e.stun=Math.max(0,e.stun-dt);e.flash=Math.max(0,e.flash-dt);e.walk+=dt*8;
  if(e.stun<=0){const dx=player.x-e.x,dy=player.y-e.y;e.face=dx<0?-1:1;if(Math.abs(dx)>49||Math.abs(dy)>36){e.vx=e.face*e.speed;e.x=clamp(e.x+e.vx*dt,38,922)}else{e.vx=0;if(e.cooldown<=0){e.cooldown=e.kind==='swift'?1.0:1.35;e.attack=.32;setTimeout(()=>{if(state==='play'&&!e.dead&&Math.abs(player.x-e.x)<76&&Math.abs(player.y-e.y)<58)hurt(e.kind==='swift'?7:10,e.x)},190)}}}
  e.x=clamp(e.x+e.vx*dt,38,922);e.vx*=Math.pow(.05,dt);e.y+=e.vy*dt;e.vy+=800*dt;if(e.y>420){e.y=420;e.vy=0}}
 enemies=enemies.filter(e=>!e.dead);if(!enemies.length){spawnTimer+=dt;if(spawnTimer>.95)nextWave()}
}
function rounded(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function background(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1b2438');g.addColorStop(.58,'#303044');g.addColorStop(1,'#111722');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // moon and distant skyline
 ctx.fillStyle='#ffe2a5';ctx.globalAlpha=.78;ctx.beginPath();ctx.arc(755,115,47,0,TAU);ctx.fill();ctx.globalAlpha=1;
 ctx.fillStyle='#202538';for(let i=0;i<14;i++){const x=i*82-20,h=70+(i*37%85);ctx.fillRect(x,220-h,62,h+95);ctx.fillStyle='#454358';ctx.fillRect(x+8,236-h,6,9);ctx.fillRect(x+31,236-h,6,9);ctx.fillStyle='#202538'}
 // dojo roof and lit windows
 ctx.fillStyle='#111827';ctx.beginPath();ctx.moveTo(188,204);ctx.lineTo(480,128);ctx.lineTo(772,204);ctx.lineTo(749,214);ctx.lineTo(480,150);ctx.lineTo(211,214);ctx.closePath();ctx.fill();ctx.fillStyle='#9f3c45';ctx.fillRect(258,208,444,107);ctx.fillStyle='#f6c371';ctx.fillRect(275,217,410,5);ctx.fillStyle='#2a2634';ctx.fillRect(296,231,369,75);ctx.fillStyle='#edb85e';ctx.font='bold 27px system-ui';ctx.textAlign='center';ctx.fillText('道 場',480,281);ctx.textAlign='left';
 // lanterns
 for(const x of [245,715]){ctx.fillStyle='#221d2a';ctx.fillRect(x-2,185,4,30);ctx.fillStyle='#e65d50';rounded(x-15,195,30,39,7);ctx.fill();ctx.fillStyle='#ffcf80';ctx.fillRect(x-8,207,16,2);ctx.globalAlpha=.12;ctx.fillStyle='#ffb85c';ctx.beginPath();ctx.ellipse(x,242,35,52,0,0,TAU);ctx.fill();ctx.globalAlpha=1}
 // floor
 const floor=ctx.createLinearGradient(0,320,0,H);floor.addColorStop(0,'#383346');floor.addColorStop(1,'#171c29');ctx.fillStyle=floor;ctx.fillRect(0,319,W,221);ctx.fillStyle='#b7855f';ctx.fillRect(0,319,W,4);ctx.globalAlpha=.19;ctx.strokeStyle='#d5a576';ctx.lineWidth=1;for(let i=0;i<9;i++){const y=347+i*i*2.35;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(let x=45;x<W;x+=100){ctx.beginPath();ctx.moveTo(480,320);ctx.lineTo(x,540);ctx.stroke()}ctx.globalAlpha=1;
 // foreground paper lantern flecks
 for(let i=0;i<22;i++){const x=(i*173+time*11)%W,y=88+(i*71)%240;ctx.globalAlpha=.18+Math.sin(time*1.7+i)*.08;ctx.fillStyle=i%3?'#ffc971':'#ff716c';ctx.fillRect(x,y,2,2)}ctx.globalAlpha=1;
}
function drawFighter(o,isPlayer){const ground=o.y,air=ground<388;ctx.save();ctx.translate(o.x,ground);if(o.face<0)ctx.scale(-1,1);const bob=!air?Math.sin(o.walk)*2:0;
 // shadow
 ctx.globalAlpha=air?.18:.34;ctx.fillStyle='#090d17';ctx.beginPath();ctx.ellipse(0,3,air?20:25,air?7:9,0,0,TAU);ctx.fill();ctx.globalAlpha=1;
 ctx.translate(0,bob);if(o.hit>0||o.flash>0){ctx.globalAlpha=.55}const skin=isPlayer?'#efbd91':'#d99b76',shirt=isPlayer?'#293954':o.kind==='swift'?'#d34449':'#7f3443',pants=isPlayer?'#20283a':'#292633';
 // legs with walk cycle
 const step=Math.sin(o.walk)*5;ctx.strokeStyle=pants;ctx.lineWidth=12;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-7,-17);ctx.lineTo(-9+step,-2);ctx.moveTo(7,-17);ctx.lineTo(9-step,-2);ctx.stroke();ctx.strokeStyle='#121722';ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(-9+step,-2);ctx.lineTo(-1+step,-1);ctx.moveTo(9-step,-2);ctx.lineTo(17-step,-1);ctx.stroke();
 // torso, belt and neck
 ctx.fillStyle=shirt;rounded(-14,-49,28,34,6);ctx.fill();ctx.fillStyle=isPlayer?'#e4b85e':'#d9b2a1';ctx.fillRect(-13,-20,26,4);ctx.fillStyle=skin;ctx.fillRect(-5,-56,10,9);
 // head, hair and eyes
 ctx.fillStyle=skin;ctx.beginPath();ctx.ellipse(0,-65,11,13,0,0,TAU);ctx.fill();ctx.fillStyle=isPlayer?'#191c27':'#21191f';ctx.beginPath();ctx.moveTo(-11,-68);ctx.quadraticCurveTo(-9,-83,3,-80);ctx.quadraticCurveTo(13,-79,11,-68);ctx.lineTo(4,-72);ctx.lineTo(-1,-68);ctx.closePath();ctx.fill();ctx.fillStyle='#241b20';ctx.fillRect(4,-66,3,2);
 // lead arm and punch
 ctx.strokeStyle=shirt;ctx.lineWidth=9;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-10,-45);ctx.lineTo(-20,-31+Math.sin(o.walk)*2);ctx.stroke();ctx.fillStyle=skin;ctx.beginPath();ctx.arc(-20,-29+Math.sin(o.walk)*2,5,0,TAU);ctx.fill();
 const punching=o.attack>0;ctx.strokeStyle=shirt;ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(10,-44);ctx.lineTo(punching?38:19,punching?-41:-30);ctx.stroke();ctx.fillStyle=skin;ctx.beginPath();ctx.arc(punching?41:19,punching?-41:-28,6,0,TAU);ctx.fill();if(punching){ctx.globalAlpha=.35;ctx.strokeStyle='#ffe6a5';ctx.lineWidth=3;ctx.beginPath();ctx.arc(47,-41,18,-.9,.8);ctx.stroke();ctx.globalAlpha=1}
 if(o.flash>0||o.hit>0)ctx.globalAlpha=1;ctx.restore();
 if(!isPlayer&&o.hp<o.maxHp){const w=38;ctx.fillStyle='#100f19';rounded(o.x-w/2,o.y-96,w,5,3);ctx.fill();ctx.fillStyle='#f06465';rounded(o.x-w/2,o.y-96,w*clamp(o.hp/o.maxHp,0,1),5,3);ctx.fill()}
}
function drawHUD(){// player health
 ctx.fillStyle='#111725d9';rounded(30,54,258,64,13);ctx.fill();ctx.strokeStyle='#ffffff22';ctx.lineWidth=1;rounded(30,54,258,64,13);ctx.stroke();ctx.fillStyle='#e8dfce';ctx.font='700 12px system-ui';ctx.fillText('DOJO FIGHTER',47,76);ctx.textAlign='right';ctx.fillStyle='#c9c4bd';ctx.fillText(`${Math.ceil(player.hp)} / ${player.maxHp}`,271,76);ctx.textAlign='left';ctx.fillStyle='#090d17';rounded(47,85,224,15,7);ctx.fill();const hp=clamp(player.hp/player.maxHp,0,1);if(hp){const hg=ctx.createLinearGradient(47,0,271,0);hg.addColorStop(0,hp<.3?'#e64656':'#f27759');hg.addColorStop(1,hp<.3?'#f56c61':'#ffbd67');ctx.fillStyle=hg;rounded(49,87,220*hp,11,5);ctx.fill()}
 ctx.textAlign='center';ctx.fillStyle='#fff0d6';ctx.font='900 24px system-ui';ctx.fillText(`WAVE ${String(wave).padStart(2,'0')}`,480,78);ctx.fillStyle='#c2bec6';ctx.font='700 10px system-ui';ctx.letterSpacing='2px';ctx.fillText('KEEP YOUR GUARD',480,96);ctx.letterSpacing='0px';ctx.textAlign='right';ctx.fillStyle='#ffe1a0';ctx.font='900 18px system-ui';ctx.fillText(String(score).padStart(6,'0'),929,68);ctx.fillStyle='#bdb9c2';ctx.font='700 10px system-ui';ctx.fillText('SCORE',929,84);ctx.textAlign='left';
 if(combo>1&&comboTimer>0){ctx.globalAlpha=Math.min(1,comboTimer);ctx.textAlign='center';ctx.fillStyle='#ffdc8d';ctx.font='900 17px system-ui';ctx.fillText(`${combo} HIT COMBO`,480,135);ctx.textAlign='left';ctx.globalAlpha=1}
}
function overlay(title,subtitle,button,extra=''){ctx.fillStyle='#080b13aa';ctx.fillRect(0,0,W,H);ctx.fillStyle='#111827ed';rounded(232,150,496,263,20);ctx.fill();ctx.strokeStyle='#ffffff25';ctx.lineWidth=1;rounded(232,150,496,263,20);ctx.stroke();ctx.fillStyle='#ed5b59';ctx.fillRect(273,184,4,36);ctx.textAlign='left';ctx.fillStyle='#ffcc70';ctx.font='800 11px system-ui';ctx.letterSpacing='3px';ctx.fillText('THE STREETS ARE YOURS',293,196);ctx.letterSpacing='0px';ctx.fillStyle='#fff4df';ctx.font='900 43px system-ui';ctx.fillText(title,290,246);ctx.fillStyle='#c8c6ce';ctx.font='15px system-ui';ctx.fillText(subtitle,292,277);if(extra){ctx.fillStyle='#ffdc93';ctx.font='700 13px system-ui';ctx.fillText(extra,292,304)}rounded(292,333,376,48,10);ctx.fillStyle='#ec625a';ctx.fill();ctx.fillStyle='#fff9ed';ctx.font='800 14px system-ui';ctx.textAlign='center';ctx.fillText(button,480,363);ctx.fillStyle='#a9acb8';ctx.font='11px system-ui';ctx.fillText('SPACE / J / ENTER   •   TAP TO PLAY',480,397);ctx.textAlign='left'}
function draw(){ctx.save();if(shake>0){const s=shake*30;ctx.translate(rand(-s,s),rand(-s,s))}background();if(player){for(const e of enemies)drawFighter(e,false);drawFighter(player,true);drawHUD()}for(const p of particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,TAU);ctx.fill()}ctx.globalAlpha=1;for(const f of floaters){ctx.globalAlpha=clamp(f.life/.8,0,1);ctx.textAlign='center';ctx.font='800 14px system-ui';ctx.fillStyle='#171520';ctx.fillText(f.text,f.x+1,f.y+1);ctx.fillStyle=f.color;ctx.fillText(f.text,f.x,f.y)}ctx.globalAlpha=1;ctx.textAlign='left';if(flash>0){ctx.globalAlpha=flash*1.6;ctx.fillStyle='#ff4458';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}if(state==='title')overlay('MIDNIGHT DOJO','One fighter. Endless challengers. Keep the dojo standing.','START FIGHT',`BEST SCORE  ${String(best).padStart(6,'0')}`);else if(state==='paused')overlay('TAKE A BREATHER','The next punch can wait.','RESUME FIGHT',`WAVE ${String(wave).padStart(2,'0')}   •   SCORE ${score}`);else if(state==='over')overlay('KNOCKED OUT','The dojo will remember your name.','FIGHT AGAIN',`FINAL SCORE  ${score}   •   BEST  ${best}`);ctx.restore()}
function frame(now){const dt=Math.min(.033,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(frame)}
// Tap/click the arena to start or resume; active play remains keyboard/touch controlled.
canvas.addEventListener('pointerdown',()=>{if(state==='title'||state==='over')startGame();else if(state==='paused')state='play'});
requestAnimationFrame(frame);
</script>
</body>
</html>
